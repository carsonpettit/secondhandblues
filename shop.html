<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Second Hand Blues</title>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Archivo+Narrow:wght@400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue: #1a2456;
            --electric-blue: #4a90e2;
            --rust: #d4634a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Archivo Narrow', sans-serif;
            background: white;
            color: var(--deep-blue);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            position: relative;
            padding: 2rem 2rem;
            border-bottom: 2px solid #e0e0e0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        h1 {
            font-family: 'Allura', cursive;
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: var(--deep-blue);
        }

        h1 a {
            color: var(--deep-blue);
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: var(--deep-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover,
        nav a.active {
            color: var(--electric-blue);
        }

        /* Page Header */
        .page-header {
            padding: 4rem 4%;
            text-align: center;
            background: white;
        }

        .page-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--deep-blue);
            margin-bottom: 1rem;
        }

        .page-header p {
            font-size: 1.2rem;
            color: var(--deep-blue);
        }

        /* Products Section */
        .products-section {
            padding: 2rem 4% 4rem;
            max-width: 1400px;
            margin: 0 auto;
            flex-grow: 1;
            width: 100%;
        }

        .collection-header {
            text-align: center;
            margin: 4rem 0 2rem 0;
            padding-top: 2rem;
            border-top: 1px solid #e0e0e0;
        }

        .collection-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--deep-blue);
            margin: 0;
        }

        /* Footer */
        footer {
            padding: 3rem 4%;
            border-top: none;
            text-align: center;
            color: white;
            margin-top: 4rem;
            background: var(--deep-blue);
        }

        footer p {
            margin-bottom: 1rem;
            color: white;
        }

        footer a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: white;
        }

        .social-icons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            align-items: center;
            margin-top: 1.5rem;
        }

        .social-icon {
            transition: transform 0.3s ease;
            display: inline-flex;
        }

        .social-icon:hover {
            transform: translateY(-3px);
        }

        .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .icon-circle:hover {
            background: #e0e0e0;
        }

        .icon-circle img,
        .icon-circle svg {
            width: 32px !important;
            height: 32px !important;
        }

        /* Hide compare at prices */
        .shopify-buy__product__compare-at,
        .shopify-buy__product__actual-price--compare-at,
        .shopify-buy__product__variant-selectors + .shopify-buy__product__price,
        .shopify-buy__product__price del,
        .shopify-buy__product__price s,
        .shopify-buy__product__price strike {
            display: none !important;
        }

        .shopify-buy__product {
            cursor: pointer !important;
        }

        /* Buttons */
        .shopify-buy__btn,
        .shopify-buy__btn--parent,
        button[class*="shopify"] {
            background-color: #1a2456 !important;
        }

        .shopify-buy__btn:hover,
        .shopify-buy__btn--parent:hover,
        button[class*="shopify"]:hover {
            background-color: #6ba3e8 !important;
        }
    </style>
</head>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Second Hand Blues</p>
        <div class="social-icons">
